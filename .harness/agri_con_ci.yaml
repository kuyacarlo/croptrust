pipeline:
  name: agri-con-ci
  identifier: agri_con_ci
  projectIdentifier: agri_con
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: account.Github
        repoName: agri-con
        build: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: build_and_test
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              # ── Frontend ──
              - step:
                  type: Run
                  name: Frontend Install
                  identifier: frontend_install
                  spec:
                    shell: Sh
                    image: node:20
                    command: |
                      npm ci || npm install
              - step:
                  type: Run
                  name: Frontend Lint and Build
                  identifier: frontend_lint_build
                  spec:
                    shell: Sh
                    image: node:20
                    envVariables:
                      NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
                      NEXT_PUBLIC_STELLAR_RPC_URL: "https://soroban-testnet.stellar.org"
                      NEXT_PUBLIC_STELLAR_HORIZON_URL: "https://horizon-testnet.stellar.org"
                      NEXT_PUBLIC_AGRI_CON_CONTRACT_ID: "placeholder"
                      NEXT_PUBLIC_CROP_NFT_CONTRACT_ID: "placeholder"
                      NEXT_PUBLIC_ESCROW_CONTRACT_ID: "placeholder"
                      NEXT_PUBLIC_VERIFICATION_CONTRACT_ID: "placeholder"
                      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
                      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
                      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder"
                      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "placeholder"
                      NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: "placeholder"
                      NEXT_PUBLIC_ORACLE_ADDRESS: "GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF"
                      NEXT_PUBLIC_TREASURY_ADDRESS: "GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF"
                    command: |
                      npm run lint
                      npx tsc --noEmit
                      npm run build
              # ── Soroban contracts ──
              - step:
                  type: Run
                  name: Contracts Build and Test
                  identifier: contracts_build_test
                  spec:
                    shell: Sh
                    image: rust:1-slim
                    command: |
                      rustup target add wasm32-unknown-unknown
                      rustup component add rustfmt clippy
                      cd contracts
                      cargo fmt --all -- --check
                      cargo clippy --all-targets -- -D warnings
                      cargo test --all
                      cargo build --release --target wasm32-unknown-unknown
