<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #e0e0e0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; overflow: hidden; }

#sidebar {
  position: fixed; left: 0; top: 0; width: 320px; height: 100vh;
  background: linear-gradient(180deg, #0d0d18 0%, #0a0a14 100%);
  border-right: 1px solid #1a1a2e; z-index: 100; overflow-y: auto;
  padding: 20px 16px;
}
#sidebar h2 { font-size: 18px; color: #8b8bff; margin-bottom: 4px; letter-spacing: 1px; }
#sidebar .subtitle { font-size: 11px; color: #555; margin-bottom: 16px; }

.filter-group { margin-bottom: 16px; }
.filter-group label { display: block; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.filter-btn {
  display: inline-block; padding: 4px 10px; margin: 2px; border-radius: 12px;
  font-size: 11px; cursor: pointer; border: 1px solid #2a2a3e; background: #12121e;
  color: #aaa; transition: all 0.2s;
}
.filter-btn:hover, .filter-btn.active { background: #2a2a4e; color: #fff; border-color: #5555aa; }
.filter-btn.active { box-shadow: 0 0 8px rgba(100,100,255,0.3); }

.stat-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.stat {
  background: #12121e; border: 1px solid #1a1a2e; border-radius: 8px;
  padding: 8px 12px; text-align: center; flex: 1; min-width: 70px;
}
.stat .num { font-size: 22px; font-weight: 700; color: #8b8bff; }
.stat .lbl { font-size: 9px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }

.legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

#detail-panel {
  position: fixed; right: -400px; top: 0; width: 380px; height: 100vh;
  background: linear-gradient(180deg, #0d0d18 0%, #0a0a14 100%);
  border-left: 1px solid #1a1a2e; z-index: 100; overflow-y: auto;
  padding: 24px 20px; transition: right 0.3s ease;
}
#detail-panel.open { right: 0; }
#detail-panel h3 { font-size: 18px; color: #fff; margin-bottom: 4px; }
#detail-panel .type-badge {
  display: inline-block; padding: 3px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 600; margin-bottom: 12px;
}
#detail-panel .desc { font-size: 13px; color: #aaa; line-height: 1.6; margin-bottom: 16px; }
#detail-panel .related-title { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
#detail-panel .related-item {
  display: block; padding: 6px 10px; margin-bottom: 2px; border-radius: 6px;
  font-size: 12px; color: #aaa; cursor: pointer; background: transparent; border: none; text-align: left; width: 100%;
}
#detail-panel .related-item:hover { background: #1a1a2e; color: #fff; }
#detail-panel .close-btn {
  position: absolute; top: 16px; right: 16px; background: none; border: none;
  color: #555; font-size: 20px; cursor: pointer;
}
#detail-panel .close-btn:hover { color: #fff; }

canvas { display: block; }

#search {
  width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid #1a1a2e;
  background: #12121e; color: #e0e0e0; font-size: 13px; margin-bottom: 16px;
}
#search::placeholder { color: #444; }
#search:focus { outline: none; border-color: #5555aa; }

.zoom-controls {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; z-index: 50;
}
.zoom-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid #1a1a2e;
  background: #12121e; color: #aaa; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.2s;
}
.zoom-btn:hover { background: #2a2a4e; color: #fff; border-color: #5555aa; }

<div id="sidebar">

</div>

<div id="detail-panel">

// ─── PHYSICS SIMULATION ─────────────────────────────────────────────
const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Node map
const nodeMap = {};
nodes.forEach(n => {
  n.x = 340 + Math.random() * (W - 700);
  n.y = 50 + Math.random() * (H - 100);
  n.vx = 0; n.vy = 0;
  nodeMap[n.id] = n;
});

let activeFilter = 'all';
let searchTerm = '';
let selectedNode = null;
let panX = 0, panY = 0, scale = 1;
let dragging = null, dragOffX = 0, dragOffY = 0;
let isPanning = false, lastMX = 0, lastMY = 0;

function isVisible(n) {
  if (activeFilter !== 'all' && n.layer !== activeFilter && n.layer !== 'all') return false;
  if (searchTerm && !n.label.toLowerCase().includes(searchTerm) && !n.id.toLowerCase().includes(searchTerm)) return false;
  return true;
}

// Stats
const skillCount = nodes.filter(n => n.group === 'process' || n.group === 'standalone' || n.group === 'council_skill').length;
const agentCount = nodes.filter(n => n.group === 'agent').length;
const councilCount = nodes.filter(n => n.group === 'council_hub' || n.group === 'council_theme').length;
const edgeCount = edges.length;
document.getElementById('stat-skills').textContent = skillCount;
document.getElementById('stat-agents').textContent = agentCount;
document.getElementById('stat-councils').textContent = councilCount;
document.getElementById('stat-edges').textContent = edgeCount;

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase();
});

// Force simulation
function simulate() {
  const alpha = 0.3;
  const repulse = 2500;
  const attract = 0.005;
  const center = 0.001;
  const cx = (W - 320) / 2 + 320;
  const cy = H / 2;

  // Repulsion
  for (let i = 0; i < nodes.length; i++) {
    if (!isVisible(nodes[i])) continue;
    for (let j = i + 1; j < nodes.length; j++) {
      if (!isVisible(nodes[j])) continue;
      let dx = nodes[i].x - nodes[j].x;
      let dy = nodes[i].y - nodes[j].y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 1;
      let force = repulse / (dist * dist);
      let fx = (dx / dist) * force;
      let fy = (dy / dist) * force;
      nodes[i].vx += fx;
      nodes[i].vy += fy;
      nodes[j].vx -= fx;
      nodes[j].vy -= fy;
    }
  }

  // Attraction (edges)
  edges.forEach(e => {
    const a = nodeMap[e.source];
    const b = nodeMap[e.target];
    if (!a || !b || !isVisible(a) || !isVisible(b)) return;
    let dx = b.x - a.x;
    let dy = b.y - a.y;
    let dist = Math.sqrt(dx * dx + dy * dy) || 1;
    let force = attract * (dist - 120);
    let fx = (dx / dist) * force;
    let fy = (dy / dist) * force;
    a.vx += fx; a.vy += fy;
    b.vx -= fx; b.vy -= fy;
  });

  // Center gravity
  nodes.forEach(n => {
    if (!isVisible(n)) return;
    n.vx += (cx - n.x) * center;
    n.vy += (cy - n.y) * center;
  });

  // Apply velocity
  nodes.forEach(n => {
    if (!isVisible(n) || dragging === n) return;
    n.vx *= 0.85;
    n.vy *= 0.85;
    n.x += n.vx * alpha;
    n.y += n.vy * alpha;
  });
}

function draw() {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  ctx.translate(panX, panY);
  ctx.scale(scale, scale);

  // Draw edges
  edges.forEach(e => {
    const a = nodeMap[e.source];
    const b = nodeMap[e.target];
    if (!a || !b || !isVisible(a) || !isVisible(b)) return;
    const isDashed = e.dashed;

    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = isDashed ? 'rgba(100,100,150,0.15)' : 'rgba(100,100,150,0.25)';
    ctx.lineWidth = isDashed ? 0.5 : 1;
    if (isDashed) ctx.setLineDash([4, 4]); else ctx.setLineDash([]);
    ctx.stroke();
    ctx.setLineDash([]);

    if (e.label) {
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2;
      ctx.fillStyle = 'rgba(150,150,200,0.5)';
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(e.label, mx, my - 4);
    }
  });

  // Draw nodes
  nodes.forEach(n => {
    if (!isVisible(n)) return;

    const isSelected = selectedNode === n;
    const r = n.r || 10;

    // Glow
    if (isSelected || n.group === 'council_hub' || n.group === 'entry') {
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 6, 0, Math.PI * 2);
      ctx.fillStyle = n.color.replace(')', ',0.15)').replace('rgb', 'rgba').replace('##', '#');
      const grd = ctx.createRadialGradient(n.x, n.y, r, n.x, n.y, r + 12);
      grd.addColorStop(0, n.color + '44');
      grd.addColorStop(1, n.color + '00');
      ctx.fillStyle = grd;
      ctx.fill();
    }

    // Node
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fillStyle = n.color + (isSelected ? 'ff' : 'cc');
    ctx.fill();
    ctx.strokeStyle = isSelected ? '#fff' : n.color + '66';
    ctx.lineWidth = isSelected ? 2 : 1;
    ctx.stroke();

    // Label
    ctx.fillStyle = isSelected ? '#fff' : '#ccc';
    ctx.font = (isSelected ? 'bold ' : '') + (r > 12 ? '12' : '10') + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(n.label, n.x, n.y + r + 12);
  });

  ctx.restore();
}

function loop() {
  simulate();
  draw();
  requestAnimationFrame(loop);
}
loop();

// ─── INTERACTION ──────────────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
  const mx = (e.clientX - panX) / scale;
  const my = (e.clientY - panY) / scale;

  // Hit test nodes (reverse order for top-most)
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (!isVisible(n)) continue;
    const dx = mx - n.x;
    const dy = my - n.y;
    if (dx * dx + dy * dy < (n.r + 4) * (n.r + 4)) {
      dragging = n;
      dragOffX = mx - n.x;
      dragOffY = my - n.y;
      selectedNode = n;
      showDetail(n);
      return;
    }
  }
  selectedNode = null;
  closeDetail();
  isPanning = true;
  lastMX = e.clientX;
  lastMY = e.clientY;
});

canvas.addEventListener('mousemove', e => {
  if (dragging) {
    dragging.x = (e.clientX - panX) / scale - dragOffX;
    dragging.y = (e.clientY - panY) / scale - dragOffY;
    dragging.vx = 0; dragging.vy = 0;
  } else if (isPanning) {
    panX += e.clientX - lastMX;
    panY += e.clientY - lastMY;
    lastMX = e.clientX;
    lastMY = e.clientY;
  }
});

canvas.addEventListener('mouseup', () => {
  dragging = null;
  isPanning = false;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  scale *= delta;
  scale = Math.max(0.2, Math.min(3, scale));
}, { passive: false });

function showDetail(n) {
  const panel = document.getElementById('detail-panel');
  document.getElementById('detail-name').textContent = n.label;
  document.getElementById('detail-desc').textContent = n.desc || '';

  const badge = document.getElementById('detail-badge');
  const groupNames = {
    entry: 'Entry Point', process: 'Process Skill', council_hub: 'Council Hub',
    council_skill: 'Council Skill', council_theme: 'Themed Council',
    agent: 'Agent', platform_hub: 'Platform Hub', feature_hub: 'Feature Pipeline',
    review_hub: 'Review Pipeline', standalone: 'Standalone Skill'
  };
  badge.textContent = groupNames[n.group] || n.group;
  badge.style.background = n.color + '33';
  badge.style.color = n.color;

  // Related
  const related = [];
  edges.forEach(e => {
    if (e.source === n.id) related.push({ id: e.target, label: e.label || 'calls' });
    if (e.target === n.id) related.push({ id: e.source, label: e.label || 'called by' });
  });
  const container = document.getElementById('detail-related');
  container.innerHTML = '';
  related.forEach(r => {
    const rn = nodeMap[r.id];
    if (!rn) return;
    const btn = document.createElement('button');
    btn.className = 'related-item';
    btn.innerHTML = `<span style="color:${rn.color}">●</span> ${rn.label} <span style="color:#555;font-size:10px">(${r.label})</span>`;
    btn.onclick = () => {
      selectedNode = rn;
      showDetail(rn);
    };
    container.appendChild(btn);
  });

  panel.classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
}

function zoomIn() { scale = Math.min(3, scale * 1.2); }
function zoomOut() { scale = Math.max(0.2, scale * 0.8); }
function resetView() { scale = 1; panX = 0; panY = 0; }

// Double-click to focus
canvas.addEventListener('dblclick', e => {
  const mx = (e.clientX - panX) / scale;
  const my = (e.clientY - panY) / scale;
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (!isVisible(n)) continue;
    const dx = mx - n.x;
    const dy = my - n.y;
    if (dx * dx + dy * dy < (n.r + 4) * (n.r + 4)) {
      panX = W / 2 - n.x * scale;
      panY = H / 2 - n.y * scale;
      return;
    }
  }
});
</script>
